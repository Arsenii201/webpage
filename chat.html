<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Messenger POC</title>
<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

#app {
  width: 380px;
  height: 620px;
  background: #222;
  border-radius: 16px;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

input, button, select {
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin-top: 4px;
}

button {
  background: dodgerblue;
  color: white;
  cursor: pointer;
}

#messages {
  flex: 1;
  overflow-y: auto;
  background: #000;
  padding: 5px;
  border-radius: 10px;
  margin-bottom: 5px;
}

.msg {
  background: #333;
  margin: 5px;
  padding: 6px;
  border-radius: 8px;
  font-size: 14px;
  position: relative;
}

.time {
  font-size: 10px;
  color: #aaa;
  float: right;
}

.action {
  font-size: 11px;
  cursor: pointer;
  margin-left: 6px;
}

.edit { color: orange; }
.del { color: red; }
</style>
</head>

<body>
<div id="app">

<!-- LOGIN -->
<div id="login">
  <h3>Login / Register</h3>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<!-- CHAT -->
<div id="chat" style="display:none;">
  <h3 id="welcome"></h3>

  <select id="room" onchange="switchRoom()">
    <option value="general">general</option>
    <option value="games">games</option>
    <option value="tech">tech</option>
  </select>

  <button onclick="logout()">Logout</button>

  <div id="messages"></div>

  <input id="text" placeholder="Message">
  <button onclick="send()">Send</button>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
/* ---------- FIREBASE ---------- */
firebase.initializeApp({
  apiKey: "AIzaSyCHA0x5tq8Po9liJMAiW-8mKfdcpVTwq_I",
  authDomain: "catweb-17233.firebaseapp.com",
  databaseURL: "https://catweb-17233-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "catweb-17233",
  storageBucket: "catweb-17233.firebasestorage.app",
  messagingSenderId: "570888605898",
  appId: "1:570888605898:web:e7f4cf78b06a8280792433"
});

var db = firebase.database();
var messagesRef;

/* ---------- HASH + SALT ---------- */
function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h << 5) - h + str.charCodeAt(i);
    h |= 0;
  }
  return h.toString();
}

function makeSalt() {
  return Math.random().toString(36).substring(2, 10);
}

/* ---------- STORAGE ---------- */
var accounts = JSON.parse(localStorage.getItem("accounts") || "{}");
var currentUser = localStorage.getItem("currentUser");

/* ---------- UI ---------- */
var loginDiv = document.getElementById("login");
var chatDiv = document.getElementById("chat");
var messagesDiv = document.getElementById("messages");
var textInput = document.getElementById("text");
var roomSelect = document.getElementById("room");

/* ---------- ANTI-SPAM ---------- */
var lastSend = 0;
var lastText = "";
var COOLDOWN = 1500;

/* ---------- AUTH ---------- */
function register() {
  let u = user.value.trim();
  let p = pass.value.trim();
  if (!u || !p) return alert("Fill fields");
  if (accounts[u]) return alert("User exists");

  let salt = makeSalt();
  accounts[u] = { salt: salt, hash: hash(p + salt) };
  localStorage.setItem("accounts", JSON.stringify(accounts));
  alert("Registered");
}

function login() {
  let u = user.value.trim();
  let p = pass.value.trim();
  let acc = accounts[u];
  if (!acc) return alert("No user");
  if (hash(p + acc.salt) !== acc.hash) return alert("Wrong password");

  currentUser = u;
  localStorage.setItem("currentUser", u);
  startChat();
}

function logout() {
  localStorage.removeItem("currentUser");
  location.reload();
}

/* ---------- CHAT ---------- */
function startChat() {
  loginDiv.style.display = "none";
  chatDiv.style.display = "block";
  welcome.textContent = "Hello, " + currentUser;
  switchRoom();
}

function switchRoom() {
  messagesDiv.innerHTML = "";
  if (messagesRef) messagesRef.off();

  let room = roomSelect.value;
  messagesRef = db.ref("messages/" + room);
  listen();
}

function send() {
  let now = Date.now();
  let text = textInput.value.trim();
  if (!text) return;
  if (now - lastSend < COOLDOWN) return;
  if (text === lastText) return;

  lastSend = now;
  lastText = text;

  messagesRef.push({
    user: currentUser,
    uid: currentUser,
    text: text,
    time: now
  });

  textInput.value = "";
}

textInput.addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

/* ---------- MESSAGES ---------- */
var elements = {};

function listen() {
  messagesRef.limitToLast(100).on("child_added", snap => {
    let msg = snap.val();
    let key = snap.key;

    let div = document.createElement("div");
    div.className = "msg";

    render(div, msg, key);
    elements[key] = div;

    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  });

  messagesRef.on("child_changed", snap => {
    let key = snap.key;
    let msg = snap.val();
    if (elements[key]) render(elements[key], msg, key);
  });

  messagesRef.on("child_removed", snap => {
    let key = snap.key;
    if (elements[key]) elements[key].remove();
    delete elements[key];
  });
}

function render(div, msg, key) {
  let d = new Date(msg.time);
  let time =
    String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0");

  div.innerHTML =
    "<b>" + msg.user + "</b>: " + msg.text +
    "<span class='time'>" + time + "</span>";

  if (msg.uid === currentUser) {
    let edit = document.createElement("span");
    edit.textContent = "edit";
    edit.className = "action edit";
    edit.onclick = () => editMsg(key, msg.text);

    let del = document.createElement("span");
    del.textContent = "delete";
    del.className = "action del";
    del.onclick = () => messagesRef.child(key).remove();

    div.appendChild(edit);
    div.appendChild(del);
  }
}

function editMsg(key, oldText) {
  let n = prompt("Edit message:", oldText);
  if (n && n !== oldText) {
    messagesRef.child(key).update({ text: n });
  }
}

/* ---------- AUTO LOGIN ---------- */
if (currentUser) startChat();
</script>
</body>
</html>
