<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 8 March Mom</title><style>

body{
margin:0;
overflow:hidden;
font-family:Arial, sans-serif;
text-align:center;

background:linear-gradient(-45deg,#ff9ac4,#ffd6e8,#ffc0cb,#ff9ac4);
background-size:400% 400%;
animation:bgmove 12s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

canvas{
position:absolute;
top:0;
left:0;
}

.title{
position:absolute;
top:8%;
width:100%;
font-size:clamp(30px,6vw,80px);
color:#ff2f6d;

text-shadow:
0 0 10px #ff5c93,
0 0 20px #ff5c93,
0 0 40px #ff2f6d;

animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff5c93;}
to{ text-shadow:0 0 40px #ff2f6d;}
}

.message{
position:absolute;
top:20%;
width:100%;
font-size:clamp(18px,3vw,32px);
color:#333;
}

button{
position:absolute;
top:32%;
left:50%;
transform:translateX(-50%);

padding:16px 28px;
font-size:clamp(16px,2vw,24px);

border:none;
border-radius:12px;

background:#ff4f8b;
color:white;
cursor:pointer;
}

</style></head><body><div class="title">🌸 Happy 8 March Mom 🌸</div>
<div class="message">You are the best mom in the universe ❤️</div>
<button onclick="explode(window.innerWidth/2,window.innerHeight/2)">
Tap for Flowers
</button><canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
}
resize();
window.onresize=resize;

/* ---------- PARTICLES ---------- */

let hearts=[];
let flowers=[];
let explosions=[];

/* heart shape */

function heartPoint(t){
let x=16*Math.pow(Math.sin(t),3);
let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
return {x,y};
}

/* create 3D heart */

let heartParticles = 40;

for(let i=0;i<heartParticles;i++){

let t=Math.random()*Math.PI*2;
let p=heartPoint(t);

hearts.push({
x:p.x*10,
y:-p.y*10,
z:(Math.random()-0.5)*200
});
}

/* falling flowers */

for(let i=0;i<30;i++){
flowers.push({
x:Math.random()*W,
y:Math.random()*H,
speed:1+Math.random()*2
});
}

/* explosion */

function explode(x,y){

for(let i=0;i<25;i++){

let angle=Math.random()*Math.PI*2;
let speed=3+Math.random()*3;

explosions.push({
x,y,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
life:60
});
}
}

canvas.onclick=e=>explode(e.clientX,e.clientY);

/* ---------- ANIMATION ---------- */

let rot=0;

function draw(){

ctx.clearRect(0,0,W,H);

/* rotate heart */

rot+=0.01;

hearts.forEach(p=>{

let x=p.x*Math.cos(rot)-p.z*Math.sin(rot);
let z=p.x*Math.sin(rot)+p.z*Math.cos(rot);

let scale=300/(300+z);

let sx=W/2+x*scale;
let sy=H/2+p.y*scale;

ctx.font=14*scale+"px Arial";
ctx.fillText("❤",sx,sy);

});

/* falling flowers */

flowers.forEach(f=>{

ctx.font="22px Arial";
ctx.fillText("🌸",f.x,f.y);

f.y+=f.speed;
if(f.y>H) f.y=-20;

});

/* explosions */

explosions.forEach((p,i)=>{

ctx.font="24px Arial";
ctx.fillText("🌸",p.x,p.y);

p.x+=p.vx;
p.y+=p.vy;
p.life--;

if(p.life<0) explosions.splice(i,1);

});

requestAnimationFrame(draw);

}

draw();

</script></body>
</html>
